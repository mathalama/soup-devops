name: Hardened release
run-name: Hardened / ${{ inputs.bug || github.ref_name }}
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      bug:
        type: choice
        options: [fixed, python310, windows, missing-data, entry-point]
        default: fixed
permissions:
  contents: read
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ inputs.bug || 'fixed' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/inject_bug.py "$BUG"
        env:
          BUG: ${{ inputs.bug || 'fixed' }}
      - run: python -m pip install --require-hashes --no-cache-dir -r requirements-dev.txt
      - run: ruff check .
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python -m build --no-isolation
      - name: Check tag and distribution versions
        run: python scripts/check_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
  installed:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist-${{ github.sha }}
          path: dist
      - name: Install and exercise wheel and sdist outside checkout
        run: python scripts/check_distributions.py
  docker:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist-${{ github.sha }}
          path: dist
      - run: docker build --no-cache -t soup-verify .
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [installed, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist-${{ github.sha }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@106e0b0b7c337fa67ed433972f777c6357f78598
        with:
          repository-url: https://test.pypi.org/legacy/
  verify-index:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist-${{ github.sha }}
          path: dist
      - run: python -m scripts.verify_index
