name: Naive source checks
run-name: Naive / ${{ inputs.bug }}
on:
  workflow_dispatch:
    inputs:
      bug:
        type: choice
        options: [fixed, python310, windows, missing-data, entry-point]
        default: fixed
permissions:
  contents: read
jobs:
  naive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/inject_bug.py "$BUG"
        env:
          BUG: ${{ inputs.bug }}
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m unittest discover -s tests -p naive_test.py -v
        env:
          PYTHONPATH: src
      - run: python -m build --no-isolation
